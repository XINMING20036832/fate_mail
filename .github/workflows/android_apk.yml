name: build-android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Pub get
        run: flutter pub get

      - name: Generate android/local.properties
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          cat android/local.properties

      - name: Gradle assembleDebug (capture log, don't stop)
        id: gbuild
        continue-on-error: true
        shell: bash
        run: |
          cd android
          set +e
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee ../gradle-build.log
          code=$?
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          exit 0

      - name: Print real error section (auto extract)
        if: ${{ steps.gbuild.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "===== FAILURE BLOCK ====="
          grep -nE "FAILURE: Build failed|What went wrong:|\\* Exception is:|Caused by:" -n gradle-build.log | tail -n 120 || true
          echo "===== LAST 200 LINES ====="
          tail -n 200 gradle-build.log || true

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Fail job if build failed
        if: ${{ steps.gbuild.outputs.exit_code != '0' }}
        run: exit 1
