name: build-android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Pub get
        run: flutter pub get

      - name: Generate android/local.properties
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          cat android/local.properties

      - name: Gradle assembleDebug with stacktrace
        shell: bash
        run: |
          cd android
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle Log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
